name: Deploy EmDash
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  deploy:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    concurrency:
      group: emdash-d1-${{ inputs.target || 'production' }}-${{ vars.EMDASH_D1_DATABASE_ID }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Migrate, deploy and verify
        run: bun scripts/deploy.ts '${{ inputs.target || 'production' }}'
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: deployment-record
          path: deployment/release-*.json
